[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmit-wiki"
version = "0.1.5"
description = "Wiki-only knowledge-base layer for raw Markdown produced by LMIT."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
packaging = [
  "pyinstaller>=6.0",
]

[project.scripts]
lmit-wiki = "lmit_wiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
